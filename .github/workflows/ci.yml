name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '18'

jobs:
  # ============================================
  # BACKEND TESTS
  # ============================================
  backend-tests:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Run linting
        run: |
          ruff check .

      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend

  # ============================================
  # FRONTEND BUILD & LINT
  # ============================================
  frontend-build:
    name: Frontend Build (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # - name: Lint (if configured)
      #   run: npm run lint

  # ============================================
  # DOCKER BUILD TEST
  # ============================================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build -t q-identity-backend:test -f Dockerfile.backend ./backend

      - name: Build frontend image
        run: |
          docker build -t q-identity-frontend:test -f Dockerfile.frontend ./frontend

  # ============================================
  # DEPLOY TO STAGING (on develop branch)
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, docker-build]
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway (staging)
        if: secrets.RAILWAY_TOKEN != ''
        run: |
          echo "Deploying to Railway staging..."
          # railway up --environment staging --token ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy to Render (staging)
        if: secrets.RENDER_API_KEY != ''
        run: |
          echo "Deploying to Render staging..."
          # curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
          #   -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"

  # ============================================
  # DEPLOY TO PRODUCTION (on main branch)
  # ============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, docker-build]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway (production)
        if: secrets.RAILWAY_TOKEN != ''
        run: |
          echo "Deploying to Railway production..."
          # railway up --environment production --token ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy to Render (production)
        if: secrets.RENDER_API_KEY != ''
        run: |
          echo "Deploying to Render production..."
